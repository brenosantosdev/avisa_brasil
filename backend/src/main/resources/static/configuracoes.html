<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações · AvisaBrasil</title>
  <meta name="theme-color" content="#0B4F73">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AvisaBrasil">
  <script src="/js/preferencias.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="stylesheet" href="/css/configuracoes.css">
</head>
<body>
  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/><path d="M3 13c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/><path d="M3 18c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/></svg>
        <span>
          <span class="marca-nome" data-i18n="app.nome">AvisaBrasil</span>
          <span class="marca-local" data-comunidade-local></span>
        </span>
      </a>
      <button id="botao-ouvir" class="botao botao-ouvir" type="button" aria-pressed="false">
        <svg aria-hidden="true"></svg><span data-i18n="ouvir">Ouvir</span>
      </button>
    </div>
  </header>

  <nav class="navegacao" id="navegacao" data-atual="configuracoes"></nav>

  <main>
    <h1 data-i18n="config.titulo">Configurações</h1>
    <p class="intro" data-i18n="config.intro"></p>
    <div id="estado-config" class="estado-config" role="status" aria-live="polite"></div>

    <div id="grupos-config"></div>

    <section class="cartao secao" aria-labelledby="titulo-apagar">
      <h2 id="titulo-apagar" data-i18n="config.apagar.titulo">Apagar dados deste aparelho</h2>
      <p data-i18n="config.apagar.explica"></p>
      <ul id="lista-apagar" class="lista-apagar"></ul>
      <p class="nota" data-i18n="config.apagar.naoApaga"></p>
      <div id="aviso-fila" class="mensagem-alerta-config" hidden></div>
      <button type="button" class="botao botao-perigo-config botao-largo" id="botao-apagar"><span data-i18n="config.apagar.botao"></span></button>
      <div id="resultado-apagar" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="rodape"><p data-i18n="app.rodape"></p></footer>

  <script src="/js/comum.js"></script>
  <script src="/js/configuracoes.js"></script>
</body>
</html>
