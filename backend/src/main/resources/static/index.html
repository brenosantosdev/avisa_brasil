<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AvisaBrasil</title>
  <meta name="theme-color" content="#0B4F73">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AvisaBrasil">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="stylesheet" href="/css/inicio.css">
</head>
<body>
  <header class="topo">
    <div class="topo-interno">
      <a class="marca" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/><path d="M3 13c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/><path d="M3 18c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/></svg>
        <span>
          <span class="marca-nome" data-i18n="app.nome">AvisaBrasil</span>
          <span class="marca-local" data-comunidade-local></span>
        </span>
      </a>
      <button id="botao-ouvir" class="botao botao-ouvir" type="button" aria-pressed="false">
        <svg aria-hidden="true"></svg><span data-i18n="ouvir">Ouvir</span>
      </button>
    </div>
  </header>

  <nav class="navegacao" id="navegacao" data-atual="inicio"></nav>

  <main>
    <h1 class="so-leitor" data-i18n="inicio.titulo">Como está a comunidade agora</h1>
    <div id="simulacao"></div>

    <section id="semaforo" class="semaforo" aria-live="polite" aria-labelledby="pergunta-seguro">
      <p class="carregando" data-i18n="carregando">Carregando dados reais…</p>
    </section>

    <div class="inicio-grade">
      <section class="cartao" aria-labelledby="pergunta-acontecendo">
        <h2 id="pergunta-acontecendo" data-i18n="inicio.perguntaAcontecendo">O que está acontecendo?</h2>
        <div id="acontecendo"></div>
      </section>
      <section class="cartao" aria-labelledby="pergunta-fazer">
        <h2 id="pergunta-fazer" data-i18n="inicio.perguntaFazer">O que eu faço agora?</h2>
        <div id="fazer"></div>
      </section>
    </div>

    <section class="secao" aria-labelledby="titulo-legenda">
      <h2 id="titulo-legenda" data-i18n="inicio.legendaTitulo">O que significa cada cor</h2>
      <ul class="legenda-niveis" id="legenda"></ul>
    </section>

    <section class="cartao secao" aria-labelledby="titulo-mochila">
      <h2 id="titulo-mochila" data-i18n="inicio.mochilaTitulo">Mochila de emergência</h2>
      <p data-i18n="inicio.mochilaIntro"></p>
      <ul class="checklist" id="mochila"></ul>
    </section>

    <div id="lugar-instalar"></div>

    <section class="cartao secao" id="fontes"></section>
  </main>

  <footer class="rodape"><p data-i18n="app.rodape"></p></footer>

  <script src="/js/comum.js"></script>
  <script src="/js/inicio.js"></script>
</body>
</html>
