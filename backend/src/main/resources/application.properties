# ===== AvisaBrasil: configura\u00e7\u00e3o padr\u00e3o (desenvolvimento com H2 em arquivo) =====
spring.application.name=avisabrasil
server.port=${PORT:8080}

# Banco H2 gravado em arquivo (backend/data/avisabrasil.mv.db), n\u00e3o versionado
spring.datasource.url=jdbc:h2:file:./data/avisabrasil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em /h2-console (somente no desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# Actuator: s\u00f3 o health
management.endpoints.web.exposure.include=health

# Hor\u00e1rios sempre no fuso da comunidade piloto
spring.jackson.time-zone=America/Manaus

# ===== Comunidade piloto (coordenadas conferidas no OpenStreetMap) =====
avisabrasil.comunidade.nome=S\u00e3o Gabriel da Cachoeira
avisabrasil.comunidade.uf=AM
avisabrasil.comunidade.rio=Rio Negro
avisabrasil.comunidade.latitude=-0.1294
avisabrasil.comunidade.longitude=-67.0917
# Ponto do rio para o GloFAS: a coordenada da sede cai num igarap\u00e9 (vaz\u00e3o < 1 m\u00b3/s) na grade de 5 km;
# este ponto cai na c\u00e9lula do leito principal do Rio Negro (-0,175 / -67,075).
avisabrasil.comunidade.rio-latitude=-0.17
avisabrasil.comunidade.rio-longitude=-67.08

# ===== Fontes de dados reais =====
avisabrasil.fontes.open-meteo.url=https://api.open-meteo.com/v1/forecast
avisabrasil.fontes.open-meteo.intervalo=PT1H
avisabrasil.fontes.glofas.url=https://flood-api.open-meteo.com/v1/flood
avisabrasil.fontes.glofas.intervalo=PT6H
avisabrasil.fontes.glofas-historico.url=https://flood-api.open-meteo.com/v1/flood
avisabrasil.fontes.glofas-historico.intervalo=P1D
# OpenStreetMap via Overpass: 1 consulta por dia (pol\u00edtica de uso). Servidores tentados em ordem.
avisabrasil.fontes.overpass.servidores=https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter
avisabrasil.fontes.overpass.intervalo=P1D
avisabrasil.fontes.overpass.raio-metros=8000
# Depois de uma falha, espera este tempo antes de tentar de novo
avisabrasil.fontes.nova-tentativa=PT5M
# \u00daltimas respostas v\u00e1lidas ficam salvas aqui (sobrevivem a quedas da internet e rein\u00edcios)
avisabrasil.fontes.pasta-cache=./data/cache
avisabrasil.agendador.habilitado=true

# Erros da API em formato padr\u00e3o (RFC 9457)
spring.mvc.problemdetails.enabled=true
