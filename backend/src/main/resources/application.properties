# ===== AvisaBrasil: configura\u00e7\u00e3o padr\u00e3o (desenvolvimento com H2 em arquivo) =====
spring.application.name=avisabrasil
server.port=${PORT:8080}

# Banco H2 gravado em arquivo (backend/data/avisabrasil.mv.db), n\u00e3o versionado
# WRITE_DELAY=0: grava no disco a cada confirmacao (uma queda do processo nao perde o ultimo dado)
spring.datasource.url=jdbc:h2:file:./data/avisabrasil;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em /h2-console (somente no desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# Actuator: s\u00f3 o health
management.endpoints.web.exposure.include=health

# Hor\u00e1rios sempre no fuso da comunidade piloto
spring.jackson.time-zone=America/Manaus

# ===== Comunidade piloto (coordenadas conferidas no OpenStreetMap) =====
avisabrasil.comunidade.nome=S\u00e3o Gabriel da Cachoeira
avisabrasil.comunidade.uf=AM
avisabrasil.comunidade.rio=Rio Negro
avisabrasil.comunidade.latitude=-0.1294
avisabrasil.comunidade.longitude=-67.0917
# Ponto do rio para o GloFAS: a coordenada da sede cai num igarap\u00e9 (vaz\u00e3o < 1 m\u00b3/s) na grade de 5 km;
# este ponto cai na c\u00e9lula do leito principal do Rio Negro (-0,175 / -67,075).
avisabrasil.comunidade.rio-latitude=-0.17
avisabrasil.comunidade.rio-longitude=-67.08

# ===== Fontes de dados reais =====
avisabrasil.fontes.open-meteo.url=https://api.open-meteo.com/v1/forecast
avisabrasil.fontes.open-meteo.intervalo=PT1H
avisabrasil.fontes.glofas.url=https://flood-api.open-meteo.com/v1/flood
avisabrasil.fontes.glofas.intervalo=PT6H
avisabrasil.fontes.glofas-historico.url=https://flood-api.open-meteo.com/v1/flood
avisabrasil.fontes.glofas-historico.intervalo=P1D
# OpenStreetMap via Overpass: 1 consulta por dia (pol\u00edtica de uso). Servidores tentados em ordem.
avisabrasil.fontes.overpass.servidores=https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter
avisabrasil.fontes.overpass.intervalo=P1D
avisabrasil.fontes.overpass.raio-metros=8000
# Depois de uma falha, espera este tempo antes de tentar de novo
avisabrasil.fontes.nova-tentativa=PT5M
# \u00daltimas respostas v\u00e1lidas ficam salvas aqui (sobrevivem a quedas da internet e rein\u00edcios)
avisabrasil.fontes.pasta-cache=./data/cache
avisabrasil.agendador.habilitado=true

# Erros da API em formato padr\u00e3o (RFC 9457)
spring.mvc.problemdetails.enabled=true

# ===== ANA HidroWebService (usu\u00e1rio e senha s\u00f3 nas vari\u00e1veis ANA_USUARIO e ANA_SENHA) =====
avisabrasil.ana.url=https://www.ana.gov.br/hidrowebservice/EstacoesTelemetricas
avisabrasil.ana.intervalo-telemetria=PT15M
# O token da ANA vale 60 min: reaproveita por 55 min e nunca tenta login de novo antes de 10 min
avisabrasil.ana.validade-token=PT55M
avisabrasil.ana.intervalo-minimo-login=PT10M
# Hist\u00f3rico baixado ano a ano, um pedido por vez, com esta pausa entre eles
avisabrasil.ana.pausa-historico=PT20S
# Esta\u00e7\u00f5es escolhidas a partir do invent\u00e1rio (HidroInventarioEstacoes, UF=AM, 11/11/2026).
# Principal: \u00fanica esta\u00e7\u00e3o do Rio Negro na regi\u00e3o com telemetria ativa (cota e vaz\u00e3o a cada 15 min).
avisabrasil.ana.principal.codigo=14330000
avisabrasil.ana.principal.nome=Curicuriari
avisabrasil.ana.principal.rio=Rio Negro
avisabrasil.ana.principal.inicio-historico=1977
avisabrasil.ana.principal.localizacao=no Rio Negro, cerca de 33 km rio abaixo da cidade
# Cidade: r\u00e9gua convencional na sede (telemetria encerrada em 2017; leituras manuais publicadas com atraso).
avisabrasil.ana.cidade.codigo=14320001
avisabrasil.ana.cidade.nome=S\u00e3o Gabriel da Cachoeira
avisabrasil.ana.cidade.rio=Rio Negro
avisabrasil.ana.cidade.inicio-historico=1982
avisabrasil.ana.cidade.localizacao=na sede do munic\u00edpio
# Cotas de refer\u00eancia (cm, na r\u00e9gua da esta\u00e7\u00e3o principal). N\u00e3o h\u00e1 cota oficial publicada pelo SGB/SACE
# para estas esta\u00e7\u00f5es (pesquisado em 11/2026). Vazias = provis\u00f3rias, calculadas do hist\u00f3rico da ANA
# (cheia: p50/p67/p90 das maiores cheias anuais; seca: p50/p33/p10 das menores cotas anuais).
# Ao preencher, informe a fonte oficial em avisabrasil.ana.cotas.fonte / seca-fonte.
avisabrasil.ana.cotas.atencao-cm=
avisabrasil.ana.cotas.alerta-cm=
avisabrasil.ana.cotas.emergencia-cm=
avisabrasil.ana.cotas.fonte=
avisabrasil.ana.cotas.seca-atencao-cm=
avisabrasil.ana.cotas.seca-alerta-cm=
avisabrasil.ana.cotas.seca-emergencia-cm=
avisabrasil.ana.cotas.seca-fonte=

# ===== Motor de risco =====
# Sobe o n\u00edvel antes, se pela tend\u00eancia a pr\u00f3xima cota for atingida em at\u00e9 estas horas
avisabrasil.risco.horas-antecedencia-cheia=24
avisabrasil.risco.horas-antecedencia-seca=168
# Chuva prevista para hoje ou amanh\u00e3 (mm) que leva a Aten\u00e7\u00e3o (alagamento e deslizamento)
avisabrasil.risco.chuva-forte-mm=50
# Sem leitura nova nesse tempo, o sensor deixa de contar
avisabrasil.risco.sensor-sem-dados-apos=PT30M

# ===== Sensor de n\u00edvel (SIMULADO: n\u00e3o h\u00e1 hardware f\u00edsico) =====
# Leituras na mesma r\u00e9gua da esta\u00e7\u00e3o principal, para valerem as mesmas cotas.
# Posi\u00e7\u00e3o: a da r\u00e9gua da ANA na cidade (esta\u00e7\u00e3o 14320001).
avisabrasil.sensor.codigo=SGC-01
avisabrasil.sensor.nome=Sensor de n\u00edvel SGC-01 (simulado)
avisabrasil.sensor.simulado=true
avisabrasil.sensor.latitude=-0.1367
avisabrasil.sensor.longitude=-67.0856
avisabrasil.sensor.descricao=Sensor simulado (simulador Java ou ESP32 no Wokwi). Leituras na r\u00e9gua de Curicuriari.

# ===== Segredos: s\u00f3 das vari\u00e1veis de ambiente (nunca escreva valores aqui) =====
# Cada canal se desliga sozinho quando a vari\u00e1vel n\u00e3o existe.
avisabrasil.segredos.ana-usuario=${ANA_USUARIO:}
avisabrasil.segredos.ana-senha=${ANA_SENHA:}
avisabrasil.segredos.ntfy-topico=${NTFY_TOPICO:}
avisabrasil.segredos.ntfy-servidor=${NTFY_SERVIDOR:https://ntfy.sh}
avisabrasil.segredos.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
avisabrasil.segredos.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
avisabrasil.segredos.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
avisabrasil.segredos.twilio-from=${TWILIO_FROM:}
avisabrasil.segredos.twilio-destinos=${TWILIO_DESTINOS:}
avisabrasil.segredos.sensor-api-key=${SENSOR_API_KEY:}
# Senha do Painel da Defesa Civil. Sem ela, o painel fica trancado.
avisabrasil.segredos.painel-senha=${PAINEL_SENHA:}

# ===== Sess\u00e3o do painel =====
# Cookie s\u00f3 para o servidor (HttpOnly) e s\u00f3 no mesmo site (SameSite=Lax, protege contra envio de outros sites)
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Pedidos de ajuda ficam guardados por este prazo e depois s\u00e3o apagados (aviso de privacidade)
avisabrasil.ajuda.retencao=P90D
