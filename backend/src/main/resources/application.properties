# ===== AvisaBrasil: configuração padrão (desenvolvimento com H2 em arquivo) =====
spring.application.name=avisabrasil
server.port=${PORT:8080}

# Banco H2 gravado em arquivo (backend/data/avisabrasil.mv.db), não versionado
spring.datasource.url=jdbc:h2:file:./data/avisabrasil;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do H2 em /h2-console (somente no desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# Actuator: só o health
management.endpoints.web.exposure.include=health

# Horários sempre no fuso da comunidade piloto
spring.jackson.time-zone=America/Manaus
