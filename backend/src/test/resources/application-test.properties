# Testes usam H2 em mem\u00f3ria para n\u00e3o disputar o arquivo do desenvolvimento
spring.datasource.url=jdbc:h2:mem:avisabrasil-teste;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
avisabrasil.agendador.habilitado=false
avisabrasil.fontes.pasta-cache=target/cache-teste
# Testes nunca usam credenciais reais nem enviam notifica\u00e7\u00f5es, mesmo que a m\u00e1quina tenha as vari\u00e1veis
avisabrasil.segredos.ana-usuario=
avisabrasil.segredos.ana-senha=
avisabrasil.segredos.ntfy-topico=
avisabrasil.segredos.telegram-bot-token=
avisabrasil.segredos.twilio-account-sid=
avisabrasil.segredos.twilio-auth-token=
avisabrasil.segredos.twilio-from=
avisabrasil.segredos.twilio-destinos=
avisabrasil.segredos.sensor-api-key=
avisabrasil.telegram.polling=false
avisabrasil.segredos.painel-senha=senha-de-teste
